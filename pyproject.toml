[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-industrial-atlas"
version = "0.1.0"
description = "Atlas geospasial titik industri dan fasilitas tanggap darurat di kabupaten/kota Indonesia, dengan uji spatial join, coverage, dan sensitivitas asumsi."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "geopandas==1.2.0",
  "shapely==2.2.0",
  "pyogrio==0.13.0",
  "pyproj==3.8.0",
  "pandas==3.1.0",
  "numpy==2.5.4",
  "scipy==1.18.1",
  "pyarrow==26.0.0",
  "duckdb==1.5.5",
  "duckdb-extension-spatial==1.5.5",
  "duckdb-extension-httpfs==1.5.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
geo-atlas = "geo_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: Real data run

# Unduh data asli langsung dari sumbernya di runner GitHub (tidak bergantung pada izin host sesi),
# jalankan pipeline, cek reprodusibilitas, lalu commit hasil bila diminta.
on:
  # Setiap PR yang mengubah pipeline diuji ulang dengan data asli yang diunduh dari sumbernya.
  pull_request:
    paths:
      - "src/**"
      - "tools/**"
      - "pyproject.toml"
      - ".github/workflows/real-data.yml"
  workflow_dispatch:
    inputs:
      commit_results:
        description: "Commit hasil yang dihasilkan ulang ke cabang ini bila berbeda"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Simpan hash yang di-commit
        run: python tools/check_reproducible.py snapshot
      - name: Unduh geoBoundaries + Overture (rilis dikunci)
        run: geo-atlas fetch
      - name: Pipeline run 1
        run: geo-atlas run
      - name: Bandingkan dengan versi yang di-commit (K10)
        id: cmp
        # Di PR perbedaan = gagal; lewat dispatch boleh beda lalu di-commit bila diminta.
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        run: python tools/check_reproducible.py compare
      - name: Pipeline run 2 harus identik dengan run 1
        run: |
          cp results/publish_manifest.json /tmp/run1.json
          geo-atlas run
          diff results/publish_manifest.json /tmp/run1.json
      - run: pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: hasil-real-data
          path: |
            results/
            data/raw/manifest.json
      - name: Commit hasil (opsional)
        if: github.event_name == 'workflow_dispatch' && inputs.commit_results && steps.cmp.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results web/public/data
          git commit -m "Hasil pipeline dari data asli (workflow real-data)"
          git push

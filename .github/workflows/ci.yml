name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      # Tes unit (fixture spatial join, geodesi, skenario) + tes hasil publikasi yang di-commit.
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Paritas browser vs Python (216 skenario)
        run: npm test
      - name: Build + cek ukuran file dan atribusi
        run: npm run build
      - name: Aksesibilitas (axe)
        run: |
          npx playwright install --with-deps chromium
          npx astro preview --port 4321 &
          npx wait-on http://localhost:4321/ --timeout 60000
          node tests/axe.mjs http://localhost:4321/
